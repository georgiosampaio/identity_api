
name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: db_usuario
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d db_usuario"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and test with Maven
        run: bash ./mvnw -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/db_usuario
          DB_USERNAME: postgres
          DB_PASSWORD: ci_test_password_only
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
